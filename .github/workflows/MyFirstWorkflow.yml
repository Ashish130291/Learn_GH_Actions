name: MyFirstWorkflow
on: 
  push:
    branches:
      - main
      - demo
      - test
  workflow_dispatch:
  pull_request:
    branches:
      - main
jobs:
  Adding-Requirements:
     name: adding requirements from requirements.txt
     runs-on: ubuntu-latest
     steps:
       - name: Checkout Code
         uses: actions/checkout@v5.1.0
       - name: setup Python
         uses: actions/setup-python@v7.0.0
         with:
           python-version: '3.10'
       - name: install dependencies
         run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
       - name: Run Unit Tests
         run: |
           mkdir reports/
           pytest --cov=. --cov-report=html:reports/htmlcov --cov-report=term
       - name: Upload code Coverage report
         uses: actions/upload-artifact@v7.0.1
         with:
           name: unit test report
           path: reports/
  codeql:
    name: Code Quality Security Scan 
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: ['python']  
    steps:
       - name: Checkout Code
         uses: actions/checkout@v5.1.0
       - name: Initialize CodeQL
         uses: github/codeql-action/init@v3
         with:
          languages: ${{ matrix.language }}  
       - name: Perform CodeQL Analysis
         uses: github/codeql-action/analyze@v3
         with:
           category: "security"
  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [codeql] 
    if: success()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5.0.0
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate Image Tag
        id: vars
        run: |
          IMAGE_TAGS= "${{ github.run_id}}-${GITHUB_SHA::4}"
          echo "Image Tag = $IMAGE_TAGS">> $GITHUB_OUTPUT
      - name: Build image 
        uses: docker/build-push-actions@v5
        with:
          context:
            file: ./Dockerfile
            push: false
            tags: my-first-app:${{steps.vars.output.IMAGE_TAGS}}
      - name: Save Docker Image 
        run: docker save my-first-app:${{steps.vars.output.IMAGE_TAGS}} -o my-first-app.tar
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: my-first-app
          path: my-first-app.tar
