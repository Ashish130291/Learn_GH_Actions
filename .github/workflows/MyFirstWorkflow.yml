name: MyFirstWorkflow
on: 
  push:
    branches:
      - main
      - demo
      - test
  workflow_dispatch:
  pull_request:
    branches:
      - main
jobs:
  Adding-Requirements:
     name: adding requirements from requirements.txt
     runs-on: ubuntu-latest
     steps:
       - name: Checkout Code
         uses: actions/checkout@v5.1.0
       - name: setup Python
         uses: actions/setup-python@v7.0.0
         with:
           python-version: '3.10'
       - name: install dependencies
         run: |
           python -m pip install --upgrade pip
           pip install -r requirements.txt
       - name: Run Unit Tests
         run: |
           mkdir reports/
           pytest --cov=. --cov-report=html:reports/htmlcov --cov-report=term
       - name: Upload code Coverage report
         uses: actions/Upload-artifacts@7
         with:
           name: unit test report
           path: reports/
        
